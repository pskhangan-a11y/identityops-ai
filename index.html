
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdentityOps AI</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    margin: 0;
    padding: 24px;
    color: #172334;
  }
  main { max-width: 950px; margin: auto; }
  h1 { color: #23477d; }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin: 24px 0;
  }
  .card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    flex: 1;
    min-width: 160px;
  }
  .number { font-size: 30px; font-weight: bold; }
  table {
    width: 100%;
    background: white;
    border-collapse: collapse;
  }
  th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }
  th { background: #e7edf7; }
  .risk { color: #ba2727; font-weight: bold; }
  .table-wrap { overflow-x: auto; }

/* Risk filter buttons */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 16px 0 20px;
}

.filter-btn {
  padding: 10px 22px;
  border: 1px solid #b9c7da;
  border-radius: 8px;
  background: white;
  color: #23477d;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}

.filter-btn:hover {
  background: #e7edf7;
}

.filter-btn.active {
  background: #23477d;
  color: white;
  border-color: #23477d;
}

.filter-btn:focus-visible {
  outline: 3px solid #5688d3;
  outline-offset: 2px;
}


/* Orphan Account Burndown Chart */

.burndown {
  background: white;
  padding: 24px;
  margin-top: 30px;
  border-radius: 12px;
}

.burndown h2 {
  color: #23477d;
  margin-top: 0;
}

.chart-note {
  color: #64748b;
  font-size: 14px;
  line-height: 1.6;
}

.chart-wrap {
  width: 100%;
  margin-top: 20px;
  overflow: hidden;
}

#burndown-chart {
  display: block;
  width: 100%;
  height: auto;
  background: #f8fafc;
  border-radius: 8px;
}

.chart-summary {
  margin-top: 16px;
  font-weight: 600;
  color: #23477d;
}

</style>
</head>
<body>
<main>
  <h1>IdentityOps AI</h1>
  <p>Open-source IAM Analytics Dashboard</p>
  <p>Demo using synthetic data only.</p>

  <section class="cards">
    <div class="card">
      Total Accounts
      <div class="number" id="total"></div>
    </div>
    <div class="card">
      Orphan Accounts
      <div class="number" id="orphans"></div>
    </div>
    <div class="card">
      High-Risk Orphans
      <div class="number" id="highrisk"></div>
    </div>
  </section>

  <h2>Orphan Account Detection</h2>
  
  <div class="filters" role="group" aria-label="Filter orphan accounts by risk">
    <button type="button" class="filter-btn active" data-risk="ALL" aria-pressed="true">All</button>
    <button type="button" class="filter-btn" data-risk="HIGH" aria-pressed="false">High</button>
    <button type="button" class="filter-btn" data-risk="MEDIUM" aria-pressed="false">Medium</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Account</th>
          <th>Owner</th>
          <th>Risk</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>
  <!-- START: Burndown Chart -->
  <section class="burndown" aria-labelledby="burndown-title">

    <h2 id="burndown-title">
      Orphan Account Remediation Burndown
    </h2>

    <p class="chart-note">
      Open orphan accounts remaining at the end of
      each day. Synthetic demo data.
    </p>

    <div class="chart-wrap">
      <svg
        id="burndown-chart"
        role="img"
        aria-label="Orphan accounts decreasing from 8 to 3 over 7 days"
        viewBox="0 0 700 320"
        preserveAspectRatio="xMidYMid meet">
      </svg>
    </div>

    <p id="burndown-summary" class="chart-summary"></p>

  </section>
  <!-- END: Burndown Chart -->
</main>

<script>
const accounts = [
  {name:"admin01", owner:"", privileged:true},
  {name:"user02", owner:"Employee A", privileged:false},
  {name:"svc_backup", owner:"", privileged:false},
  {name:"user04", owner:"Employee B", privileged:false},
  {name:"admin05", owner:"", privileged:true}
];

const orphans = accounts.filter(a => !a.owner);
const highRisk = orphans.filter(a => a.privileged);

document.getElementById("total").textContent = accounts.length;
document.getElementById("orphans").textContent = orphans.length;
document.getElementById("highrisk").textContent = highRisk.length;

function renderAccounts(risk = "ALL") {
  const filtered = orphans.filter(account => {
    const accountRisk = account.privileged
      ? "HIGH"
      : "MEDIUM";

    return risk === "ALL" || accountRisk === risk;
  });

  document.getElementById("results").innerHTML =
    filtered.map(account => `
      <tr>
        <td>${account.name}</td>
        <td>Unassigned</td>
        <td class="risk">
          ${account.privileged ? "HIGH" : "MEDIUM"}
        </td>
      </tr>
    `).join("") ||
    `<tr><td colspan="3">No accounts found</td></tr>`;
}

// Activate filter buttons
document.querySelectorAll(".filter-btn").forEach(button => {
  button.addEventListener("click", () => {
    const selectedRisk = button.dataset.risk;

    document.querySelectorAll(".filter-btn").forEach(btn => {
      const isActive = btn === button;
      btn.classList.toggle("active", isActive);
      btn.setAttribute("aria-pressed", String(isActive));
    });

    renderAccounts(selectedRisk);
  });
});

// Display all orphan accounts initially
renderAccounts("ALL");

/* Burndown Chart - Synthetic IAM Data */

const burndownData = [8, 7, 6, 5, 5, 4, 3];

const svg = document.getElementById("burndown-chart");

const xAt = index => 60 + index * 100;
const yAt = value => 265 - (value / 8) * 220;

// Helper function to draw SVG elements
function addSvg(tag, attributes, label = "") {
  const element = document.createElementNS(
    "http://www.w3.org/2000/svg",
    tag
  );

  Object.entries(attributes).forEach(([key, value]) => {
    element.setAttribute(key, value);
  });

  if (label !== "") {
    element.textContent = label;
  }

  svg.appendChild(element);
}

// Draw horizontal grid lines and Y-axis values
[0, 2, 4, 6, 8].forEach(value => {
  addSvg("line", {
    x1: 60,
    y1: yAt(value),
    x2: 660,
    y2: yAt(value),
    stroke: "#dbe5f0"
  });

  addSvg("text", {
    x: 45,
    y: yAt(value) + 4,
    "text-anchor": "end",
    fill: "#64748b",
    "font-size": 13
  }, String(value));
});

// Create line-chart coordinates
const points = burndownData.map((value, index) =>
  `${xAt(index)},${yAt(value)}`
).join(" ");

// Draw the burndown line
addSvg("polyline", {
  points: points,
  fill: "none",
  stroke: "#23477d",
  "stroke-width": 4,
  "stroke-linecap": "round",
  "stroke-linejoin": "round"
});

// Draw data points and day labels
burndownData.forEach((value, index) => {
  addSvg("circle", {
    cx: xAt(index),
    cy: yAt(value),
    r: 6,
    fill: "#23477d"
  });

  addSvg("text", {
    x: xAt(index),
    y: yAt(value) - 14,
    "text-anchor": "middle",
    fill: "#23477d",
    "font-size": 14,
    "font-weight": "bold"
  }, String(value));

  addSvg("text", {
    x: xAt(index),
    y: 295,
    "text-anchor": "middle",
    fill: "#64748b",
    "font-size": 13
  }, `Day ${index + 1}`);
});

// Calculate remediation progress
const initial = burndownData[0];
const remaining = burndownData[burndownData.length - 1];
const remediated = initial - remaining;
const percentage = (remediated / initial) * 100;

document.getElementById("burndown-summary").textContent =
  `${remediated} orphan accounts remediated ` +
  `(${percentage.toFixed(1)}%) over 7 days. ` +
  `${remaining} accounts remaining. ` +
  `Synthetic demo data.`;

</script>
</body>
</html>
